</div>

<script>

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Checking login...";
    message.style.color = "#2563eb";

    try {

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            message.textContent =
                data.message || "Invalid username or password.";

            message.style.color = "#dc2626";
            return;
        }

        if (!data.user || data.user.role !== "patient") {

            message.textContent =
                "Access denied. This account is not a patient account.";

            message.style.color = "#dc2626";
            return;
        }

        localStorage.setItem("gjh_token", data.token);
        localStorage.setItem(
            "gjh_user",
            JSON.stringify(data.user)
        );

        message.textContent = "Login successful. Opening Patient Panel...";
        message.style.color = "#16a34a";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 500);

    } catch (error) {

        message.textContent =
            "Server connection failed. Please start the hospital server.";

        message.style.color = "#dc2626";

    }

});

</script>
