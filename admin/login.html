<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Gopal Joshi Hospital</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #374151
                );
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow:
                0 15px 40px
                rgba(0,0,0,.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-top: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .security {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #991b1b;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 17px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #374151;
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .demo {
            margin-top: 20px;
            padding: 13px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            GJ
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Gopal Joshi Hospital
        </p>


        <div class="security">

            <strong>
                Private Area:
            </strong>

            Only authorized hospital administrators
            can access this panel.

        </div>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                Login as Admin
            </button>

        </form>


        <div
            id="message"
            class="message error"
        ></div>


        <div class="demo">

            <strong>
                Demo Login
            </strong>

            <br><br>

            Username:
            <strong>admin</strong>

            <br>

            Password:
            <strong>admin123</strong>

        </div>


        <a
            href="../index.html"
            class="back"
        >
            ← Back to Hospital
        </a>

    </div>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                message.style.display =
                    "none";


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.textContent =
                            data.message ||
                            "Invalid login details.";

                        message.style.display =
                            "block";

                        return;

                    }


                    if (
                        !data.user ||
                        data.user.role !==
                            "admin"
                    ) {

                        message.textContent =
                            "This account does not have Admin access.";

                        message.style.display =
                            "block";

                        return;

                    }


                    localStorage.setItem(
                        "gjh_token",
                        data.token
                    );


                    localStorage.setItem(
                        "gjh_user",
                        JSON.stringify(
                            data.user
                        )
                    );


                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Admin login error:",
                        error
                    );


                    message.textContent =
                        "Server connection failed. Please start the hospital server.";

                    message.style.display =
                        "block";

                }

            }
        );

    </script>

</body>

</html>
