<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Gopal Joshi Hospital</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #374151
                );
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.28);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-top: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .hospital-info {
            background: #f3f4f6;
            border-radius: 9px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 13px;
            color: #374151;
        }

        .hospital-name {
            font-weight: bold;
            color: #111827;
            margin-bottom: 4px;
        }

        .security {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #991b1b;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 17px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #374151;
            box-shadow:
                0 0 0 3px
                rgba(55, 65, 81, 0.10);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #374151;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .demo {
            margin-top: 20px;
            padding: 13px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
            line-height: 1.7;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            color: #6b7280;
            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            GJ
        </div>


        <h1>
            Hospital Admin Login
        </h1>


        <p class="subtitle">
            Gopal Joshi Hospital SaaS
        </p>


        <div class="hospital-info">

            <div class="hospital-name">
                Gopal Joshi Hospital
            </div>

            <div>
                Hospital Code: GJH001
            </div>

        </div>


        <div class="security">

            <strong>
                Private Area:
            </strong>

            Only authorized hospital administrators
            can access this panel.

        </div>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >
                Login as Admin
            </button>

        </form>


        <div
            id="loading"
            class="loading"
        >
            Authenticating hospital account...
        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="demo">

            <strong>
                Demo Login
            </strong>

            <br>

            Username:
            <strong>admin</strong>

            <br>

            Password:
            <strong>admin123</strong>

        </div>


        <a
            href="../index.html"
            class="back"
        >
            ← Back to Hospital
        </a>

    </div>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        /* =========================================
           SHOW MESSAGE
        ========================================= */

        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

            message.style.display =
                "block";

        }


        /* =========================================
           LOGIN
        ========================================= */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    usernameInput
                        .value
                        .trim();


                const password =
                    passwordInput
                        .value;


                if (
                    !username ||
                    !password
                ) {

                    showMessage(
                        "Username and password are required."
                    );

                    return;

                }


                message.style.display =
                    "none";


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Signing in...";


                loading.style.display =
                    "block";


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {

                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password,

                                        hospitalId:
                                            "HOSP-TEST-001"

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    /* =================================
                       API ERROR
                    ================================= */

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        showMessage(
                            data.message ||
                            "Login failed."
                        );

                        return;

                    }


                    /* =================================
                       USER CHECK
                    ================================= */

                    if (
                        !data.user
                    ) {

                        showMessage(
                            "User information was not returned by server."
                        );

                        return;

                    }


                    /* =================================
                       ADMIN ROLE CHECK
                    ================================= */

                    if (
                        data.user.role !==
                        "hospital_admin"
                    ) {

                        showMessage(
                            "This account does not have Hospital Admin access."
                        );

                        return;

                    }


                    /* =================================
                       HOSPITAL CHECK
                    ================================= */

                    if (
                        !data.hospital
                    ) {

                        showMessage(
                            "Hospital information was not returned."
                        );

                        return;

                    }


                    if (
                        data.hospital.status !==
                        "active"
                    ) {

                        showMessage(
                            "This hospital account is not active."
                        );

                        return;

                    }


                    /* =================================
                       SAVE SAAS SESSION
                    ================================= */

                    localStorage.setItem(
                        "gjh_token",
                        data.token
                    );


                    localStorage.setItem(
                        "gjh_user",
                        JSON.stringify(
                            data.user
                        )
                    );


                    localStorage.setItem(
                        "gjh_hospital",
                        JSON.stringify(
                            data.hospital
                        )
                    );


                    localStorage.setItem(
                        "gjh_subscription",
                        JSON.stringify(
                            data.subscription ||
                            {}
                        )
                    );


                    localStorage.setItem(
                        "gjh_hospital_stats",
                        JSON.stringify(
                            data.hospitalStats ||
                            {}
                        )
                    );


                    /* =================================
                       SAAS SESSION FLAGS
                    ================================= */

                    localStorage.setItem(
                        "gjh_logged_in",
                        "true"
                    );


                    localStorage.setItem(
                        "gjh_hospital_id",
                        data.user.hospitalId
                    );


                    localStorage.setItem(
                        "gjh_role",
                        data.user.role
                    );


                    /* =================================
                       SUCCESS
                    ================================= */

                    showMessage(
                        "Login successful. Opening Hospital Admin Dashboard...",
                        "success"
                    );


                    loginButton.textContent =
                        "Login Successful";


                    /* =================================
                       REDIRECT
                    ================================= */

                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        500
                    );

                } catch (error) {

                    console.error(
                        "Admin login error:",
                        error
                    );


                    showMessage(
                        "Server connection failed. Please make sure the hospital server is running on port 5000."
                    );

                } finally {

                    loading.style.display =
                        "none";


                    loginButton.disabled =
                        false;


                    if (
                        loginButton.textContent !==
                        "Login Successful"
                    ) {

                        loginButton.textContent =
                            "Login as Admin";

                    }

                }

            }
        );


        /* =========================================
           AUTO FILL DEMO LOGIN
        ========================================= */

        usernameInput.value =
            "admin";


        passwordInput.value =
            "admin123";

    </script>

</body>

</html>
